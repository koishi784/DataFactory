spring:
  application:
    name: dataFactory-api

  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/datafactory?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root

  # Redis配置（可选，注释掉则使用默认内存缓存）
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 3000

  # Jackson日期格式配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# MyBatis-Plus配置
mybatis-plus:
  # 实体类包路径
  type-aliases-package: com.datafactory.core.domain.entity
  # Mapper XML文件路径
  mapper-locations: classpath*:mapper/**/*.xml
  # 全局配置
  global-config:
    db-config:
      # 主键类型：AUTO-自增
      id-type: auto
      # 逻辑删除字段名
      logic-delete-field: deleted
      # 逻辑删除-删除值
      logic-delete-value: 1
      # 逻辑删除-未删除值
      logic-not-delete-value: 0
      # 字段更新策略：NOT_NULL-非NULL时更新
      update-strategy: not_null
  # 配置输出
  configuration:
    # 日志输出
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 下划线转驼峰（默认true）
    map-underscore-to-camel-case: true

# JWT配置
jwt:
  # 密钥（生产环境请使用复杂的随机字符串）
  secret: DataFactory@2026-JWT-Secret-Key-Must-Be-Long-Enough
  # 访问令牌过期时间（秒），默认2小时
  access-token-expiration: 7200
  # 刷新令牌过期时间（秒），默认7天
  refresh-token-expiration: 604800

# 文件上传配置
spring.servlet.multipart:
  max-file-size: 100MB
  max-request-size: 100MB

# 服务器配置
server:
  port: 8080
